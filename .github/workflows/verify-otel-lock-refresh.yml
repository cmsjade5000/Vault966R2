name: Verify OpenTelemetry patch locks
on:
  push:
    branches: ["validation/vault-otel-patch-locks-20261117"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5d6928fbeb769c2ec57290210035bb07e24ed144
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify release target and install lock compiler
        run: |
          test "$(git rev-parse HEAD)" = "5d6928fbeb769c2ec57290210035bb07e24ed144"
          test "$(uname -m)" = arm64
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --only-binary=:all: uv==0.12.23 pip-audit==2.10.1
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Resolve patch and compile both macOS locks
        run: |
          uv --version
          uv pip compile requirements.txt --python-version 3.12 --python-platform aarch64-apple-darwin --upgrade-package opentelemetry-api==1.45.2 --generate-hashes -o requirements.lock > /dev/null
          uv pip compile requirements.txt --python-version 3.12 --python-platform aarch64-apple-darwin --generate-hashes -o requirements.lock > /dev/null
          uv pip compile requirements-dev.txt --python-version 3.12 --python-platform aarch64-apple-darwin --constraint requirements.lock --generate-hashes -o requirements-dev.lock > /dev/null
      - name: Verify only the reviewed package and hashes changed
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          pattern = re.compile(r"^opentelemetry-api==[^\n]+\n(?:    --hash=[^\n]+\n)+", re.M)
          for path in ("requirements.lock", "requirements-dev.lock"):
              before = subprocess.check_output(["git", "show", "HEAD:" + path], text=True)
              after = Path(path).read_text()
              a, b = pattern.search(before), pattern.search(after)
              assert a and b and "==1.45.1 " in a[0] and "==1.45.2 " in b[0]
              if before.replace(a[0], b[0]) != after:
                  print("Compiler also changed other lines")
                  raise SystemExit(1)
              print(path, subprocess.check_output(["git", "hash-object", path], text=True).strip())
              print(b[0])
          PY
      - name: Audit all production pins
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          report = Path(os.environ["RUNNER_TEMP"]) / "audit.json"
          cmd = ["pip-audit", "--no-deps", "--disable-pip", "--strict", "-r", "requirements.lock", "-f", "json", "-o", str(report)]
          result = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if not report.exists():
              raise SystemExit("Audit did not produce a report")
          rows = json.loads(report.read_text())["dependencies"]
          skipped = sum("skip_reason" in d for d in rows)
          findings = sum(len(d.get("vulns", [])) for d in rows)
          print(f"Audited={len(rows)} skipped={skipped} matches={findings}")
          assert len(rows) == 34 and skipped == 0 and findings == 0 and result.returncode == 0
          PY
      - name: Verify hashed development install and release consistency tests
        env:
          DATABASE_URL: sqlite://
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/release"
          uv pip sync --python "$RUNNER_TEMP/release/bin/python" --require-hashes requirements-dev.lock
          "$RUNNER_TEMP/release/bin/python" -m pytest tests/test_vault_release.py -q
