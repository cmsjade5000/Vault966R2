name: Dependency compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [baseline, uvicorn, psycopg, alembic, sqlalchemy-current, sqlalchemy-refreshed]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dependency_test
          POSTGRES_PASSWORD: dependency_test
          POSTGRES_DB: dependency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dependency_test -d dependency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install baseline and cumulative targets
        env:
          STACK: ${{ matrix.stack }}
        run: |
          python -m pip install -r requirements.txt pytest openapi-python-client==0.29.0
          case "$STACK" in
            baseline) ;;
            uvicorn) python -m pip install 'uvicorn[standard]==0.54.0' ;;
            psycopg) python -m pip install 'uvicorn[standard]==0.54.0' 'psycopg[binary]==3.3.6' ;;
            alembic) python -m pip install 'uvicorn[standard]==0.54.0' 'psycopg[binary]==3.3.6' 'alembic==1.20.0' ;;
            sqlalchemy-current) python -m pip install 'uvicorn[standard]==0.54.0' 'psycopg[binary]==3.3.6' 'alembic==1.20.0' 'SQLAlchemy==2.1.1' ;;
            sqlalchemy-refreshed) python -m pip install 'uvicorn[standard]==0.54.0' 'psycopg[binary]==3.3.6' 'alembic==1.20.0' 'SQLAlchemy==2.1.3' ;;
          esac
          python -m pip check
          python -m pip freeze
          python -c 'import psycopg; print("libpq:", psycopg.pq.version())'
      - name: Test SQLite application and real HTTP transport
        run: python -m pytest -ra -W default --ignore=tests/test_dependency_postgres.py
      - name: Test PostgreSQL driver contracts
        env:
          DEPENDENCY_TEST_DATABASE_URL: postgresql+psycopg://dependency_test:dependency_test@127.0.0.1:5432/dependency_test
          REQUIRE_DEPENDENCY_POSTGRES: "1"
        run: python -m pytest tests/test_dependency_postgres.py -ra -W default
      - name: Replay PostgreSQL migrations on disposable service
        env:
          DATABASE_URL: postgresql+psycopg://dependency_test:dependency_test@127.0.0.1:5432/dependency_test
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 202607020001
          python -m alembic upgrade head
