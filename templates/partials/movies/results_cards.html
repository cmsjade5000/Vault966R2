{% if movies %}
  {% if featured_movies %}
  <div class="grid" aria-label="Featured movie results">
    {% for movie in featured_movies %}
    <article
      class="card{% if movie.flagged %} card--flagged{% endif %}"
      data-movie-card
      data-movie-id="{{ movie.id }}"
      data-flagged="{{ 'true' if movie.flagged else 'false' }}"
    >
      <a class="card-link" href="/ui/movies/{{ movie.id }}">
        {% if movie.poster_url %}
        <img class="poster" src="{{ movie.poster_url }}" alt="{{ movie.title }} poster" loading="lazy" />
        {% else %}
        <div class="poster poster--empty {{ movie.poster_theme or 'poster-theme-default' }}" aria-hidden="true">🍿</div>
        {% endif %}
        <h2>{{ movie.title }}</h2>
      </a>
      <div class="card-actions">
        <button
          type="button"
          class="edit-toggle"
          data-edit-button
          data-movie-id="{{ movie.id }}"
          aria-label="Edit {{ movie.title }}"
        >
          Edit
        </button>
        <button
          type="button"
          class="flag-toggle{% if movie.flagged %} is-flagged{% endif %}"
          data-flag-button
          data-movie-id="{{ movie.id }}"
          data-flagged="{{ 'true' if movie.flagged else 'false' }}"
          data-flag-default="Metadata cleanup"
          aria-pressed="{{ 'true' if movie.flagged else 'false' }}"
        >
          {% if movie.flagged %}Resolve flag{% else %}Flag to fix{% endif %}
        </button>
      </div>
    </article>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty" role="status">
    <p>No posters available for this filter set yet.</p>
  </div>
  {% endif %}
{% endif %}
