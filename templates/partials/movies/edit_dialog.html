<dialog
  class="edit-dialog"
  data-edit-dialog
  aria-hidden="true"
  aria-labelledby="edit-dialog-title"
  aria-describedby="edit-dialog-description"
>
  <div class="edit-dialog__sheet">
    <header class="edit-dialog__header">
      <div>
        <h2 id="edit-dialog-title">Edit Movie</h2>
        <p id="edit-dialog-description">Update this movie's metadata.</p>
      </div>
      <button type="button" class="edit-dialog__close" data-edit-close aria-label="Close edit dialog">×</button>
    </header>
    <form class="edit-form" id="edit-form" autocomplete="off">
      <input type="hidden" id="edit-movie-id" />
      <div class="edit-form__grid">
        <label>
          <span>Title</span>
          <input id="edit-title" type="text" required />
        </label>
        <label>
          <span>Year</span>
          <input id="edit-year" type="number" inputmode="numeric" min="1888" max="2100" />
        </label>
        <label>
          <span>Runtime (min)</span>
          <input id="edit-runtime" type="number" inputmode="numeric" min="1" />
        </label>
        <label class="edit-form__full">
          <span>Poster URL</span>
          <input id="edit-poster" type="url" placeholder="https://" />
        </label>
        <label class="edit-form__full">
          <span>Genres <small>(comma separated)</small></span>
          <input id="edit-genres" type="text" placeholder="Science Fiction, Adventure" />
        </label>
        <label class="edit-form__full">
          <span>Synopsis</span>
          <textarea id="edit-plot" rows="5" placeholder="Add a quick summary"></textarea>
        </label>
      </div>
      <div class="edit-form__lookup" id="edit-lookup">
        <div class="edit-form__lookup-buttons">
          <button type="button" class="button-ghost" id="edit-lookup-button">Find matches</button>
          <button type="button" class="button-ghost" id="edit-lookup-retry" hidden>Search again</button>
        </div>
        <p class="edit-form__hint" id="edit-lookup-hint" hidden>
          Pick a match to replace this entry's details.
        </p>
        <p class="edit-form__hint" id="edit-lookup-empty" hidden>
          Run “Find matches” to see replacement options.
        </p>
        <p class="edit-form__status" id="edit-status" role="status" aria-live="polite" hidden></p>
        <div class="edit-lookup-cards" id="edit-lookup-cards" hidden></div>
      </div>
      <div class="edit-form__lookup-results" id="edit-lookup-results" hidden>
        <table class="edit-lookup-table">
          <thead>
            <tr>
              <th scope="col">Poster</th>
              <th scope="col">Title</th>
              <th scope="col">Year</th>
              <th scope="col">Runtime</th>
              <th scope="col">Match</th>
              <th scope="col">IDs</th>
              <th scope="col">Synopsis</th>
              <th scope="col" class="edit-lookup-table__actions">Replace</th>
            </tr>
          </thead>
          <tbody id="edit-lookup-results-body"></tbody>
        </table>
      </div>
      <div class="edit-form__actions">
        <button type="button" class="button-ghost button-danger" id="edit-delete-button">Delete</button>
        <button type="button" class="button-ghost" data-edit-cancel>Cancel</button>
        <button type="submit" class="button-primary" id="edit-submit">Save changes</button>
      </div>
    </form>
  </div>
</dialog>
