<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Vault 966{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon.ico') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', path='img/apple-touch-icon.png') }}" />
    <link rel="apple-touch-icon-precomposed" href="{{ url_for('static', path='img/apple-touch-icon-precomposed.png') }}" />
    <link rel="manifest" href="{{ url_for('static', path='site.webmanifest') }}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-2048x2732.png') }}"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-2732x2048.png') }}"
      media="(device-width: 1366px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-1668x2388.png') }}"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-2388x1668.png') }}"
      media="(device-width: 1194px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-1668x2224.png') }}"
      media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-2224x1668.png') }}"
      media="(device-width: 1112px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-1536x2048.png') }}"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="{{ url_for('static', path='img/splash-2048x1536.png') }}"
      media="(device-width: 1024px) and (device-height: 768px) and (-webkit-device-pixel-ratio: 2)"
    />
    <style>
      :root {
        --flic-primary: #0f2d4a;
        --flic-accent: #1e90ff;
        --flic-bg: #030617;
        --flic-chip-bg: rgba(15, 45, 74, 0.8);
        --flic-text: #e2e8f0;
        --flic-muted: #94a3b8;
        --nav-height: 72px;
        --shell-max: clamp(320px, 92vw, 1200px);
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: var(--flic-bg);
        background-image: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08), transparent 45%),
          radial-gradient(circle at 80% 0%, rgba(14, 165, 233, 0.08), transparent 40%),
          linear-gradient(180deg, rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95));
        color: var(--flic-text);
        line-height: 1.6;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: var(--flic-accent);
      }

      a:focus-visible,
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--flic-accent);
        outline-offset: 2px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 0.25rem 0.6rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .chip-flic {
        background: var(--flic-primary);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
      }

      .skip-link {
        position: absolute;
        left: -999px;
        top: 0;
        background: var(--flic-accent);
        color: var(--flic-primary);
        padding: 0.5rem 1rem;
        border-radius: 0 0 0.5rem 0.5rem;
        z-index: 1001;
      }

      .skip-link:focus {
        left: 1rem;
      }

      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .app-main {
        flex: 1;
        display: block;
      }

      .site-nav {
        background: rgba(7, 16, 32, 0.95);
        border-bottom: 1px solid rgba(30, 144, 255, 0.15);
        position: sticky;
        top: 0;
        z-index: 900;
        backdrop-filter: blur(14px);
        min-height: var(--nav-height);
        box-shadow: 0 12px 24px rgba(2, 6, 23, 0.45);
      }

      .nav-inner {
        max-width: var(--shell-max);
        margin: 0 auto;
        padding: 0.75rem clamp(1rem, 4vw, 2rem);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
      }

      .brand-mark {
        font-size: 1.05rem;
        letter-spacing: 0.12em;
      }

      .brand-subtitle {
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        color: rgba(226, 232, 240, 0.7);
        text-transform: uppercase;
      }

      .nav-toggle {
        border-radius: 999px;
        border: 1px solid rgba(30, 144, 255, 0.35);
        background: rgba(30, 144, 255, 0.12);
        color: #f8fafc;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        display: none;
      }

      .nav-toggle[aria-expanded="true"] {
        background: rgba(30, 144, 255, 0.25);
      }

      .primary-nav {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-wrap: wrap;
        flex: 1 1 auto;
        justify-content: flex-end;
      }

      .nav-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        min-height: 2.5rem;
        border: 1px solid rgba(30, 144, 255, 0.25);
        padding: 0.45rem 0.95rem;
        background: transparent;
        color: #f8fafc;
        font-size: 0.85rem;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.01em;
        transition: background 160ms ease, color 160ms ease, border 160ms ease, transform 160ms ease;
        touch-action: manipulation;
      }

      .nav-link:hover,
      .nav-link:focus-visible {
        background: rgba(30, 144, 255, 0.25);
        border-color: rgba(30, 144, 255, 0.5);
      }

      .nav-link.is-active {
        background: rgba(30, 144, 255, 0.35);
        border-color: rgba(125, 211, 252, 0.85);
        color: #fff;
        box-shadow: 0 6px 18px rgba(14, 116, 144, 0.4);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .nav-cta {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        min-height: 2.5rem;
        border: none;
        padding: 0 1.25rem;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        cursor: pointer;
        color: #04101f;
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.95), rgba(37, 99, 235, 0.9));
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      .nav-cta:hover,
      .nav-cta:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 16px 32px rgba(37, 99, 235, 0.45);
      }

      #toast-container {
        position: fixed;
        right: 1.5rem;
        bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        z-index: 1000;
      }

      .toast {
        min-width: 220px;
        max-width: 320px;
        background: rgba(15, 45, 74, 0.95);
        border: 1px solid rgba(30, 144, 255, 0.35);
        color: #f8fafc;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.45);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        font-size: 0.9rem;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .toast button {
        background: transparent;
        border: none;
        color: inherit;
        cursor: pointer;
        font-size: 1rem;
      }

      @media (max-width: 900px) {
        .nav-inner {
          gap: 0.75rem;
        }

        .primary-nav {
          justify-content: flex-start;
        }

        .brand-subtitle {
          font-size: 0.65rem;
        }
      }

      @media (max-width: 640px) {
        .nav-inner {
          flex-direction: column;
          align-items: stretch;
        }

        .primary-nav {
          display: none;
          width: 100%;
          flex-direction: column;
          align-items: stretch;
          gap: 0.65rem;
          border-top: 1px solid rgba(30, 144, 255, 0.15);
          padding-top: 0.85rem;
          margin-top: 0.5rem;
        }

        .primary-nav.is-open {
          display: flex;
        }

        .nav-actions {
          flex-direction: column;
          align-items: stretch;
        }

        .nav-cta {
          width: 100%;
          justify-content: center;
        }

        .nav-toggle {
          display: inline-flex;
          justify-content: center;
        }
      }

      @media (max-width: 600px) {
        #toast-container {
          left: 1rem;
          right: 1rem;
          bottom: 1rem;
          align-items: stretch;
        }

        .toast {
          max-width: none;
          width: 100%;
        }
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    {% set current_path = request.url.path %}
    <div class="app-shell">
      <header class="site-nav">
        <div class="nav-inner">
          <a class="brand" href="/ui/movies">
            <span class="brand-mark">Vault 966</span>
            <span class="brand-subtitle">Movie dispatch</span>
          </a>
          <button class="nav-toggle" type="button" aria-expanded="false" data-nav-toggle>Menu</button>
          <nav class="primary-nav" data-nav-menu>
            <div class="nav-group" role="menubar">
              <a
                class="nav-link{% if current_path == '/ui/movies' %} is-active{% endif %}"
                href="/ui/movies"
                role="menuitem"
                {% if current_path == '/ui/movies' %}aria-current="page"{% endif %}
                >Library</a
              >
              <a
                class="nav-link{% if current_path == '/ui/movies/health' %} is-active{% endif %}"
                href="/ui/movies/health"
                role="menuitem"
                {% if current_path == '/ui/movies/health' %}aria-current="page"{% endif %}
                >Collection Health</a
              >
            </div>
            <div class="nav-actions"></div>
          </nav>
        </div>
      </header>
      <main id="main" class="app-main">
        {% block content %}{% endblock %}
      </main>
    </div>
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script>
      (function () {
        const initNav = () => {
          const navToggle = document.querySelector('[data-nav-toggle]');
          const navMenu = document.querySelector('[data-nav-menu]');

          navToggle?.addEventListener('click', () => {
            const expanded = navToggle.getAttribute('aria-expanded') === 'true';
            const next = !expanded;
            navToggle.setAttribute('aria-expanded', String(next));
            navMenu?.classList.toggle('is-open', next);
          });

        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initNav, { once: true });
        } else {
          initNav();
        }
      })();

      window.showToast = function (message) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `
          <span>${message}</span>
          <button aria-label="Dismiss toast">&times;</button>
        `;
        const dismiss = () => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 200);
        };
        toast.querySelector('button').addEventListener('click', dismiss);
        container.appendChild(toast);
        requestAnimationFrame(() => {
          toast.classList.add('show');
        });
        setTimeout(dismiss, 6000);
      };

      window.persistToastMessage = function (message) {
        try {
          sessionStorage.setItem('flicToast', message);
        } catch (err) {
          console.warn('Failed to persist toast message', err);
        }
      };

      const collectFallbackPickParams = () => {
        const params = new URLSearchParams();
        const firstGenre = document.querySelector('.hero-tags [data-genre]')?.getAttribute('data-genre');
        if (firstGenre) params.set('genre', firstGenre);
        const runtimeMax = document.querySelector('.hero-tags [data-runtime]')?.getAttribute('data-runtime');
        if (runtimeMax) params.set('runtime_max', runtimeMax);
        return params;
      };

      window.runFlicPick = async function runFlicPick(options = {}) {
        const { indicator, params: initialParams } = options;
        const params = new URLSearchParams();
        if (initialParams && typeof initialParams === 'object') {
          Object.entries(initialParams).forEach(([key, value]) => {
            if (value !== undefined && value !== null && String(value).trim() !== '') {
              params.set(key, value);
            }
          });
        }
        if (!params.has('genre') || !params.has('runtime_max')) {
          const fallbackParams = collectFallbackPickParams();
          for (const [key, value] of fallbackParams.entries()) {
            if (!params.has(key)) params.set(key, value);
          }
        }

        if (window.runFlicPick.pending) {
          return;
        }
        window.runFlicPick.pending = true;
        if (indicator) {
          indicator.setAttribute('aria-busy', 'true');
          if ('disabled' in indicator) {
            indicator.disabled = true;
          }
        }
        try {
          const query = params.toString();
          const url = query ? `/movies/picks?${query}` : '/movies/picks';
          const response = await fetch(url);
          if (response.status === 404) {
            if (typeof window.showToast === 'function') {
              window.showToast('Nothing matched—want me to widen the net?');
            }
            return;
          }
          if (!response.ok) {
            if (typeof window.showToast === 'function') {
              window.showToast('I hit a snag—try again?');
            }
            return;
          }
          const data = await response.json();
          const successMessage = `I queued "${data.title}" for you.`;
          if (typeof window.persistToastMessage === 'function') {
            window.persistToastMessage(successMessage);
          }
          if (typeof window.showToast === 'function') {
            window.showToast(successMessage);
          }
          setTimeout(() => {
            window.location.href = `/ui/movies/${data.id}`;
          }, 600);
        } catch (error) {
          console.error('Global pick failed', error);
          if (typeof window.showToast === 'function') {
            window.showToast('Network hiccup—try again soon?');
          }
        } finally {
          window.runFlicPick.pending = false;
          if (indicator) {
            indicator.removeAttribute('aria-busy');
            if ('disabled' in indicator) {
              indicator.disabled = false;
            }
          }
        }
      };

      try {
        const pendingToast = sessionStorage.getItem('flicToast');
        if (pendingToast && typeof window.showToast === 'function') {
          sessionStorage.removeItem('flicToast');
          window.showToast(pendingToast);
    }
  } catch (err) {
    console.warn('Failed to restore toast message', err);
  }
</script>
    <script src="{{ url_for('static', path='js/back_link.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
