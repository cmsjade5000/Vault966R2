[tool.black]
target-version = ["py39"]
line-length = 100

[tool.ruff]
target-version = "py39"
line-length = 100
# We're on Python 3.9; keep Optional[...] etc. and allow our FastAPI patterns.
ignore = [
  "UP006",  # prefer builtins list/dict/tuple
  "UP007",  # X | Y syntax (3.10+)
  "UP035",  # typing.List deprecated
  "B008",   # Depends(...) in defaults (FastAPI)
  "E501",   # long lines (some tests/scripts)
  "E402",   # imports not at top (scripts/tests)
]
# Don’t lint generated artifacts & large blobs
extend-exclude = [
  "client_py/",
  "openapi/",
  "reports/",
  "vault.db*",
  ".venv/",
  "__pycache__/",
]
